# 导演台（静态产物）的 nginx 配置。
#
# 两件事：
#   1. SPA 回退——路由是 hash 形式（#/director），ngnix 只看到 `/`，
#      所以 `try_files ... /index.html` 足够；刷新任意页面都能拿到入口。
#   2. 把 /api 与 /health 反代到后端，保持**同源**。
#      前端所有请求都用相对路径 `/api/...`（见 web/src/api/*），
#      同源就不需要 CORS，也不用区分"开发时走 vite 代理、生产时走别的"。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 显式声明 UTF-8。界面文案全是中文，虽然 HTML 里有 <meta charset> 兜底，
    # 但对 .js / .css 等没有 meta 的资源，靠响应头才可靠
    # （否则部分环境下中文会按 Latin-1 解出乱码）。
    charset utf-8;

    # 构建产物带内容哈希（assets/index-<hash>.js），可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存：否则前端发版后用户仍拿旧 index，
    # 而旧 index 引用的是已被替换掉的 assets（白屏）。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：`/api/sessions/{id}/events` 是长连接事件流。
        # 必须关掉缓冲并放大超时，否则事件会被 nginx 攒着不发，
        # 界面进度看起来"卡住不动"——这类问题很难从后端日志看出来。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查（后端把它列在免鉴权白名单里）
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # 上传白模帧序列可能较大（15 秒 × 24fps 的 PNG）。
    # 与后端的上传口径保持一致，避免被 nginx 以 413 提前拒掉。
    client_max_body_size 128m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
