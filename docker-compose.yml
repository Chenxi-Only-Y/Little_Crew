version: "3.8"

services:
  # 后端 API（FastAPI 异步任务 + HITL + 持久化）
  api:
    build: .
    env_file: .env
    environment:
      - DB_PATH=/data/little_crew.db
      - OUTPUT_DIR=/data/outputs
    volumes:
      - crew-data:/data
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 导演台（React + Vite）**不在本文件里**。
  #
  # 原先这里跑 Streamlit（frontend/），那个前端已删除。
  # 新前端是 Vite 应用，要放进 compose 就得加一个 Node 构建阶段
  # （多阶段 Dockerfile + 静态托管），属于独立改动，没顺手塞进来。
  #
  # 需要容器化前端时，两种做法：
  #   1) 本机跑 `cd web && pnpm run dev`（默认 5183，已代理 /api 到 8000）；
  #   2) 用 nginx 托管 `pnpm run build` 产物，并把 /api 反代到 api:8000。
  # 见 README「启动」一节。

volumes:
  crew-data:
