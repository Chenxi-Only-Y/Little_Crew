; ============================================================================
;  pytest.ini —— v0.3.0（前代实现，已归档到 legacy/）
;
;  为什么需要它
;  ------------
;  本项目原先是仓库根。2026-10-12 把 v0.4.0 提为仓库主体后，v0.3.0
;  整体移进 `legacy/`。而它的测试有两处「假定自己在根」：
;
;    ① `import app.*` —— 需要 `legacy/` 在 `sys.path` 上
;    ② `Path("app/...")` / `Path("web/...")` —— 相对 **CWD** 解析
;
;  所以正确跑法是**在 `legacy/` 里跑**：
;
;      cd legacy
;      ..\.venv\Scripts\python.exe -m pytest tests -q
;
;  这样 ① `rootdir` = legacy/、`pythonpath` = . ；② CWD = legacy/ —— 两者都对。
;  **不需要改任何测试代码。**
;
;  ⚠️ 踩过的坑：一开始以为要把测试里的 `app/` 改成 `legacy/app/`，
;  结果既没必要又把路径改坏了（正则 group 错位还吞掉过目录名）。
;  教训：**如果两个东西的相对关系没变，就不要改它们的相对引用。**
; ============================================================================

[pytest]
testpaths = tests
pythonpath = .
norecursedirs = .venv node_modules data __pycache__ .pytest_cache dist
filterwarnings =
    ignore::DeprecationWarning
