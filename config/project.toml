# ============================================================================
#  项目可调参数 —— 小剧组 · Little Crew
#
#  规则（STRUCTURE.md §2）：
#    · 这里只放"会因换机器 / 换部署而变"的参数
#    · 秘密凭据不放这里（走 config/.env）
#    · 核心逻辑（编译规则表 / 授权目录 / IR Schema）不放这里 —— 它们是代码
#
#  本文件的值来自 docs/02-模型调研与适配方案.md 的实测结论，
#  凡标注「实测」的项都有本机实测数据支撑，改动前请先看该文档。
# ============================================================================

[project]
name = "小剧组"
slug = "little-crew"
# 人类可读版本号。单一来源在 src/little_crew/version.py，
# 本行由版本发布流程同步，不参与任何缓存键（应用版本 ≠ 协议版本）。
version = "0.4.0-alpha.43"

# ---------------------------------------------------------------------------
#  漫剧生产规格
#  依据：docs/02 §1.3 实测 —— H3 硬上限 10 秒，12 秒必 OOM 且降分辨率无效
# ---------------------------------------------------------------------------
[production]
# 单镜时长上限（秒）。⚠️ 不要超过 10：实测 12s 在所有分辨率下均 OOM
max_shot_seconds = 10
min_shot_seconds = 4
default_shot_seconds = 5

# 拆镜密度（镜/章），来自漫剧行业基线
shots_per_chapter_min = 11
shots_per_chapter_max = 17

# 单镜复杂度上限 —— 超限时一致性风险陡增
max_characters_per_shot = 3
max_dialogue_chars = 20

# 帧率（H3 固定 24fps，见 ComfyUI 官方节点源码 FPS = 24）
fps = 24

# 分辨率档位（分阶段渲染：草稿审片通过后才跑定稿，省 GPU 时间）
# 依据：docs/02 §7.2 —— 一集 4~7.5 小时 GPU 时间，两阶段是必需项而非优化项
[production.resolution]
draft   = { width = 480, height = 704, steps = 4 }    # 草稿档：快速试错
standard = { width = 832, height = 480, steps = 8 }    # 标准档
final   = { width = 768, height = 1344, steps = 20 }   # 定稿档

# ---------------------------------------------------------------------------
#  预算门控
#  依据：docs/02 §7.1 —— 全本地一集现金成本约 ¥5，瓶颈是 GPU 时间不是钱
# ---------------------------------------------------------------------------
[budget]
# 单集成本上限（元）。超出则停止生成并升级人工决策
max_cny_per_episode = 50.0
# 单集 GPU 时间上限（分钟）。本机实测一集约 270 分钟（4 步档）
max_gpu_minutes_per_episode = 600
# 单集 LLM token 上限
max_tokens_per_episode = 500000

# ---------------------------------------------------------------------------
#  执行与调度
#  依据：docs/02 §1.5 实测 —— 8GB 显存同时只能加载一个模型
# ---------------------------------------------------------------------------
[execution]
# 并发渲染数。本机 8GB 显存建议 1
max_concurrent_renders = 1
# 是否按模型分批调度（强烈建议 true —— 避免模型反复加载）
batch_by_model = true
# 单次自动重试上限（超过则升级人工）
max_auto_attempts = 3
# 失败重试退避
retry_backoff = "bounded_exponential"

# 显存水位门控：剩余显存低于此值时不接受新任务（MB）
vram_reserve_mb = 2048

# ---------------------------------------------------------------------------
#  缓存（三级内容寻址）
#  依据：docs/02 发现 3 —— 缓存从"优化项"升级为"生死线"
# ---------------------------------------------------------------------------
[cache]
enabled = true
# Tier-1：同环境同语义（精确命中，最快）
tier1_enabled = true
# Tier-2：跨环境语义复用（需重校验质量断言）
tier2_enabled = true
# Tier-3：镜头级条件缓存（不同 IR 但实际条件相同的镜头共享编码）
tier3_enabled = true
# 缓存目录（相对项目根）
dir = "outputs/cache"
# 单个产物保留上限（GB），超出按 LRU 淘汰
max_size_gb = 50

# ---------------------------------------------------------------------------
#  渲染检查点与断点续跑
#  依据：docs/02 发现 3 —— 一集 4 小时长跑必然中断
# ---------------------------------------------------------------------------
[checkpoint]
enabled = true
# 提交前落盘 prompt_id
record_on_submit = true
# 崩溃重启后先查 ComfyUI history 回收（绝不重复烧 GPU）
reconcile_on_start = true

# ---------------------------------------------------------------------------
#  验收门禁
#  依据：设计文档 §5.6 —— 加权总分由服务端权威计算，不信任模型自报
# ---------------------------------------------------------------------------
[gates]
# 确定性算子优先；软门禁只处理硬门禁无法判定的部分
deterministic_first = true
# 同一约束的阈值放宽累计上限（防止降级后被过度放宽而失去把关作用）
max_threshold_relax = 0.15

[gates.scoring]
# QC-5 五维权重（阶段不同权重不同，此处为 S3 分镜阶段）
completeness = 0.15
consistency = 0.30
quality = 0.25
executability = 0.25
compliance = 0.05
# 判定阈值
pass_threshold = 80
human_review_threshold = 65
# 服务端计算分与模型自报分的最大容许偏差，超出则报告作废
max_self_report_deviation = 5
# 审查循环最大轮数
max_review_rounds = 3

# ---------------------------------------------------------------------------
#  一致性
#  依据：docs/02 发现 1 实测 —— 本机无法训练 LoRA（内存 15.8GB 不足）
# ---------------------------------------------------------------------------
[consistency]
# 身份锁定手段优先级。⚠️ 本机必须"参考图优先"：LoRA 训练需 fp32 底模 22.93GB
identity_strategy = ["reference", "lora", "prompt"]
# 锚点集代数变化时是否触发依赖产物失效
invalidate_on_anchor_change = true
# 种子派生基数
base_seed = 20261011

# ---------------------------------------------------------------------------
#  授权门禁
#  依据：docs/02 §8 —— 授权风险必须代码强制，不能靠人工记忆
#  注：实际判定用的地区/商用/营收从 config/.env 读取（属部署情形）
# ---------------------------------------------------------------------------
[license]
# 是否启用授权门禁。⚠️ 强烈建议保持 true
enabled = true
# 未核实授权的模型是否允许使用（false = 拒绝，符合"未知不等于允许"）
allow_unverified_models = false
# 是否自动把归属标注写入成片尾帧
auto_inject_attribution = true

# ---------------------------------------------------------------------------
#  日志与可观测
# ---------------------------------------------------------------------------
[logging]
level = "INFO"
dir = "logs"
# 是否保留完整交付证据链（每个产物可追溯到 IR 哈希与断言结果）
keep_evidence = true
